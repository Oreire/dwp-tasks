global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # Scrape Kafka broker (via built‑in metrics endpoint)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:7071']

  # Scrape Zookeeper (4-letter-word metrics via exporter)
  # Note: Zookeeper does NOT expose Prometheus metrics natively.
  # If you add a ZK exporter later, update the target here.
  - job_name: 'zookeeper'
    static_configs:
      - targets: ['zookeeper:2181']

  # Scrape Kafka UI (it exposes /actuator/prometheus)
  - job_name: 'kafka-ui'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['kafka-ui:8080']

